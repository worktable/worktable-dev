# The MCP tool surface stays frozen while directory reviews are pending. A pull
# request that changes it needs the tool-surface-change label. Labeling starts
# a new run that reads the label from its own event payload; a queued merge
# reads its pull request's labels when it runs.
name: MCP tool surface
"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
  merge_group: null
permissions:
  contents: read
  pull-requests: read
concurrency:
  # A queued merge has no pull request number; its queue ref is unique.
  group: tool-surface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  tool-surface:
    name: tool-surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # A pull request's merge commit has the base as its first parent; a
          # queued merge's parent is the change before it in the queue.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Read the queued pull request's approval
        id: approval
        if: github.event_name == 'merge_group'
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |-
          set -euo pipefail
          # gh-readonly-queue/<base>/pr-<number>-<sha>
          number=$(printf '%s\n' "$QUEUE_REF" | sed -nE 's#^refs/heads/gh-readonly-queue/[^/]+/pr-([0-9]+)-[0-9a-f]+$#\1#p')
          test -n "$number"
          # A failed request stops here rather than reading as no label.
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number/labels" --jq '.[].name')
          if printf '%s\n' "$labels" | grep -qx tool-surface-change; then
            echo "flag=--approved" >> "$GITHUB_OUTPUT"
            echo "Pull request #$number has the tool-surface-change label."
          fi
      - name: Compare the served tool surface with the base
        run: bun run check:tool-surface --base HEAD^1 ${{ steps.approval.outputs.flag }}
