# Resolve scope once; independent heavy lanes run on separate hosts.
name: Verify
"on":
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch: null
  schedule:
    - cron: 17 5 * * 1
permissions:
  contents: read
  actions: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      suites: ${{ steps.scope.outputs.suites }}
      required: ${{ steps.scope.outputs.required }}
      desktop: ${{ steps.scope.outputs.desktop }}
      browser: ${{ steps.scope.outputs.browser }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Classify immutable change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_VERIFY: ${{ github.event_name != 'pull_request' }}
        run: bun scripts/testing/public-selection.ts
  checks:
    needs: plan
    if: needs.plan.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # The parent is the base that lint:changed compares against.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Restore declared task outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo
          key: ${{ runner.os }}-node24.15.0-bun1.3.14-turbo-v2-checks-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-node24.15.0-bun1.3.14-turbo-v2-checks-${{ hashFiles('bun.lock') }}-
      - name: Check source contracts
        run: |-
          bun run check:tools
          bun run check:theme
          bun run check:brand
          bun run check:previews
          bun run typecheck
          bun run typecheck:lab
          bun run typecheck:perf
          bun run test:policy
      - name: Check speed guards
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run perf:guards --base "$BASE_SHA"
      - name: Lint changed files
        # A pull request checks out its merge commit, whose first parent is
        # the base branch; main compares with the previous commit.
        run: bun run lint:changed --base HEAD^1
  build:
    needs: plan
    if: needs.plan.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # Lab builds take their dev version from history and release tags.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Restore declared task outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo
          key: ${{ runner.os }}-node24.15.0-bun1.3.14-turbo-v2-build-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-node24.15.0-bun1.3.14-turbo-v2-build-${{ hashFiles('bun.lock') }}-
      - name: Bind public source identity
        run: |-
          if [ "$(bun -p "require('./package.json').license")" = "AGPL-3.0-only" ]; then
            printf '%s\n' "WORKTABLE_PUBLIC_SOURCE_REPOSITORY=https://github.com/$GITHUB_REPOSITORY" "WORKTABLE_PUBLIC_SOURCE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
      - name: Provision pinned product font
        run: bun scripts/provision-product-font.ts
      - name: Build each production surface once
        run: |-
          # release:lab is the sole production web build owner; other workspace builds remain.
          bun run build --filter='!@worktable/web'
          bun run release:lab
      - name: Check bundle budgets
        run: bun run perf:bundle
      - name: Keep the beta build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: beta-${{ github.run_attempt }}
          path: dist/lab-releases/
          if-no-files-found: error
          retention-days: 1
  required:
    needs: plan
    if: needs.plan.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Use Ubuntu archive mirrors
        # The runner's preferred Azure mirror can stall package downloads.
        run: sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
      - name: Install preview Chromium
        # Server and compiled-package renderer tests use the pinned headless
        # shell; this job has an independent runner from browser journeys.
        run: bunx playwright@1.61.1 install --with-deps --only-shell chromium
      - name: Run required tests
        run: bun run test:required
      - name: Bind lane evidence
        run:
          bun scripts/testing/aggregate-ci.ts stamp --root test-results/canonical --expected "bun-standard,bun-server,cli-boundary,packaged-boundaries"
          --source "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lanes-required-${{ github.run_attempt }}
          path: test-results/canonical/
          if-no-files-found: error
          retention-days: 14
  native:
    needs: plan
    if: needs.plan.outputs.desktop == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Use Ubuntu archive mirrors
        # The runner's preferred Azure mirror can stall package downloads.
        run: sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
      - name: Install native toolchain and dependencies
        run: |-
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.0
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev
      - name: Restore native compilation cache
        if: github.event_name != 'schedule'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-rust-1.97.0-native-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-rust-1.97.0-native-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
      - name: Run native contracts
        run: bun run test:full --suite desktop-contracts
      - name: Bind lane evidence
        run:
          bun scripts/testing/aggregate-ci.ts stamp --root test-results/canonical --expected "desktop-contracts" --source
          "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lanes-native-${{ github.run_attempt }}
          path: test-results/canonical/
          if-no-files-found: error
          retention-days: 14
  browsers:
    needs: plan
    if: needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Use Ubuntu archive mirrors
        # The runner's preferred Azure mirror can stall package downloads.
        run: sudo sed -i '\|^http://azure\.archive\.ubuntu\.com/ubuntu/|d' /etc/apt/apt-mirrors.txt
      - name: Install Chromium
        run: bunx playwright@1.61.1 install --with-deps chromium
      - name: Provision pinned product font
        # Journeys render with the General Sans that releases ship.
        run: bun scripts/provision-product-font.ts
      - name: Run selected browser journeys
        env:
          SELECTED_SUITES: ${{ needs.plan.outputs.suites }}
        run: |-
          args=()
          IFS=',' read -r -a suites <<< "$SELECTED_SUITES"
          selected=()
          for suite in "${suites[@]}"; do
            if [[ "$suite" == *-browser ]]; then args+=(--suite "$suite"); selected+=("$suite"); fi
          done
          test "${#selected[@]}" -gt 0
          bun run test:full "${args[@]}"
          expected=$(IFS=,; echo "${selected[*]}")
          bun scripts/testing/aggregate-ci.ts stamp --root test-results/canonical --expected "$expected" --source "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT"
      - name: Upload lane evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lanes-browsers-${{ github.run_attempt }}
          path: test-results/canonical/
          if-no-files-found: error
          retention-days: 14
  docs:
    needs: plan
    if: needs.plan.outputs.scope == 'documentation' || needs.plan.outputs.scope == 'product-docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Check repository guides
        run: bun scripts/repository-docs.ts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: needs.plan.outputs.scope == 'product-docs'
        with:
          node-version: 24.15.0
      - name: Install docs build dependencies
        if: needs.plan.outputs.scope == 'product-docs'
        run: bun install --frozen-lockfile
      - name: Restore declared task outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .turbo
          key: ${{ runner.os }}-node24.15.0-bun1.3.14-turbo-v2-docs-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-node24.15.0-bun1.3.14-turbo-v2-docs-${{ hashFiles('bun.lock') }}-
        if: needs.plan.outputs.scope == 'product-docs'
      - name: Build and validate product documentation
        if: needs.plan.outputs.scope == 'product-docs'
        run: |-
          bun run build:docs
          bun run test:required --suite bun-standard --test-file scripts/generate-docs-content.test.ts
  verify:
    name: verify
    needs:
      - plan
      - checks
      - build
      - required
      - native
      - browsers
      - docs
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.15.0
      - name: Require every selected job
        run: bun scripts/testing/source-verification.ts
      - name: Download selected lane evidence
        if: always() && needs.plan.outputs.required == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: lanes-*-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-fragments
      - name: Validate complete source-bound portfolio
        if: always() && needs.plan.outputs.required == 'true'
        env:
          SELECTED_SUITES: ${{ needs.plan.outputs.suites }}
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: |-
          profile=changed
          if [ "$SCOPE" = full ]; then profile=full; fi
          bun scripts/testing/aggregate-ci.ts aggregate --root "$RUNNER_TEMP/ci-fragments" --expected "$SELECTED_SUITES" --source "$GITHUB_SHA" --tree "$(git rev-parse 'HEAD^{tree}')" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --profile "$profile" --output test-results/canonical/"$profile"
      - name: Upload consolidated evidence
        if: always() && needs.plan.outputs.required == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-evidence-${{ github.run_attempt }}
          path: test-results/canonical/
          if-no-files-found: warn
          retention-days: 30
      - name: Record reusable complete source proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.scope == 'full'
        run: bun scripts/testing/source-verification.ts "$RUNNER_TEMP/source-verification.json"
      - name: Publish exact source proof
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.plan.outputs.scope == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-verification-${{ github.run_attempt }}
          path: ${{ runner.temp }}/source-verification.json
          if-no-files-found: error
          retention-days: 30
  # Every verified product change on main becomes a beta build: a prerelease
  # tagged vX.Y.Z-dev.N that the beta release channel points at. Stable
  # installs never see it. Older betas are pruned; the channel only moves
  # forward, so a late-finishing older run cannot replace a newer build.
  beta:
    name: beta
    needs:
      - build
      - verify
    # !cancelled(): without a status function, the implicit success() skips
    # this job whenever any upstream job (such as docs) was skipped.
    if: >-
      !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.build.result == 'success' && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: beta-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Download the beta build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: beta-${{ github.run_attempt }}
          path: dist/lab-releases
      - name: Publish the beta build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -euo pipefail
          version="$(jq -r .version dist/lab-releases/manifest.json)"
          commit="$(jq -r .sourceCommit dist/lab-releases/manifest.json)"
          test "$commit" = "$GITHUB_SHA"
          case "$version" in
            *-dev.*+*) ;;
            *) echo "::error::Beta builds carry a dev version, got $version" >&2; exit 1 ;;
          esac
          tag="v${version%%+*}"
          (cd dist/lab-releases && sha256sum -c checksums.txt)
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" dist/lab-releases/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Worktable beta $version" \
              --notes "Beta build of $GITHUB_SHA from main, for the beta release channel. Not a stable release." \
              --prerelease \
              --latest=false
          else
            # A rerun after a partial upload: replace every asset before the
            # channel points at this tag.
            gh release upload "$tag" dist/lab-releases/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
          bun scripts/release-channels.ts publish beta "$version" "$GITHUB_SHA"
          bun scripts/release-channels.ts prune-beta --keep 10
