name: MCP Registry

# Lists Worktable Cloud's MCP server in the official MCP Registry
# (registry.modelcontextprotocol.io) under io.github.worktable. Directories
# such as the GitHub MCP Registry read from it. Each stable release publishes
# server.json stamped with the release version.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # GitHub OIDC proves the run belongs to the worktable organization.
      id-token: write
    env:
      PUBLISHER_VERSION: "1.8.7"
      PUBLISHER_SHA256: 00b21004149a4ce66f0782508ae4a2bce67d1bea395a8da0bd8028159fb59579
    steps:
      - name: Check out the public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Choose the released version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(jq -r .version package.json)"
            # A manual run republishes only a version that has been released.
            prerelease="$(gh release view "v$version" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)"
            if [ "$prerelease" != "false" ]; then
              echo "v$version is not a stable release" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install mcp-publisher
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Stamp the version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' server.json > server.stamped.json
          mv server.stamped.json server.json
          ./mcp-publisher validate server.json

      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish server.json
