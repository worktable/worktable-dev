name: OpenClaw plugin

on:
  # Keep the check present on every pull request so branch protection never
  # waits forever when a change falls outside the plugin path.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/openclaw-plugin.yml"
      - "packages/openclaw-plugin/**"
      - "plugins/worktable/**"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/openclaw-plugin
    steps:
      - name: Check out the public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Select plugin distribution inputs
        id: scope
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/testing/public-selection.ts

      - name: Install locked dependencies
        if: steps.scope.outputs.plugin == 'true'
        run: bun install --frozen-lockfile

      # Verify owns source tests and typechecking; this job owns actual
      # package reproducibility and the external ClawHub runtime contract.
      - name: Build and pack twice reproducibly
        if: steps.scope.outputs.plugin == 'true'
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          bun run pack:dogfood
          mv artifacts /tmp/worktable-openclaw-artifacts-first
          mv dist /tmp/worktable-openclaw-dist-first
          bun run pack:dogfood
          cmp "/tmp/worktable-openclaw-artifacts-first/worktable-openclaw-${version}.tgz" \
            "artifacts/worktable-openclaw-${version}.tgz"
          sha256sum "artifacts/worktable-openclaw-${version}.tgz"

      - name: Validate the ClawHub package contract
        if: steps.scope.outputs.plugin == 'true'
        run: |
          bunx clawhub@0.23.1 package validate . \
            --runtime \
            --allow-execute \
            --json
