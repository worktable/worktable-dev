name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Classify change
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FULL_VERIFY: ${{ github.event_name != 'pull_request' }}
        run: bun scripts/testing/public-selection.ts
      - name: Check repository documentation
        if: steps.scope.outputs.scope == 'documentation'
        run: bun scripts/repository-docs.ts
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: steps.scope.outputs.scope != 'documentation'
        with:
          node-version: 24.15.0
      - name: Bind source identity after the AGPL cutover
        if: steps.scope.outputs.scope != 'documentation'
        run: |
          if [ "$(bun -p "require('./package.json').license")" = "AGPL-3.0-only" ]; then
            printf '%s\n' \
              "WORKTABLE_PUBLIC_SOURCE_REPOSITORY=https://github.com/$GITHUB_REPOSITORY" \
              "WORKTABLE_PUBLIC_SOURCE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
      - name: Set up Rust
        if: steps.scope.outputs.desktop == 'true'
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.0
      - run: bun install --frozen-lockfile
        if: steps.scope.outputs.scope != 'documentation'
      - name: Restore Rust build cache
        if: steps.scope.outputs.desktop == 'true' && github.event_name != 'schedule'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/desktop/src-tauri/target
          key: ${{ runner.os }}-rust-1.97.0-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-rust-1.97.0-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}-
      - name: Install selected browser dependencies
        if: steps.scope.outputs.browser == 'true'
        run: bunx playwright@1.61.1 install --with-deps chromium
      - name: Install selected Desktop dependencies
        if: steps.scope.outputs.desktop == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev
      - run: bun run check:tools && bun run check:theme && bun run check:brand
        if: steps.scope.outputs.scope != 'documentation'
      - run: bun run build
        if: steps.scope.outputs.scope != 'documentation'
      - name: Full verification
        if: steps.scope.outputs.scope == 'full'
        run: bun run verify:full
      - name: Verify selected product lanes
        if: steps.scope.outputs.scope == 'selected'
        env:
          SELECTED_SUITES: ${{ steps.scope.outputs.suites }}
        run: |
          bun run typecheck
          bun run typecheck:lab
          bun run --cwd packages/openclaw-plugin typecheck
          bun run test:policy
          IFS=',' read -r -a suites <<< "$SELECTED_SUITES"
          args=()
          for suite in "${suites[@]}"; do args+=(--suite "$suite"); done
          bun run test:full "${args[@]}"
          # The standalone compiled artifacts/notices are a distinct boundary
          # from turbo's JS build, even when browsers/native tests are unneeded.
          bun run release:lab
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-evidence
          path: test-results/
          if-no-files-found: ignore
