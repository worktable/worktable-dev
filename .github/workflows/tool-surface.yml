# The MCP tool surface stays frozen while directory reviews are pending. A pull
# request that changes it needs the tool-surface-change label. Labeling starts
# a new run that reads the label from its own event payload.
name: MCP tool surface
"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled
permissions:
  contents: read
concurrency:
  group: tool-surface-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  tool-surface:
    name: tool-surface
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          # The merge commit's first parent is the base branch snapshot.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Compare the served tool surface with the base
        run: bun run check:tool-surface --base HEAD^1
