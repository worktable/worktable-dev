# Routine dependency updates. Runtimes (Bun, Node, Rust, the preview
# browser) and patched packages move by hand: their PRs also need source
# archives, license inventories, checksums or regenerated files.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
      # Follows the Bun pinned in package.json.
      - dependency-name: "@types/bun"
      # Pinned with the preview runtime's browser and checksums.
      - dependency-name: playwright-core
      - dependency-name: "@playwright/test"
      # Carry local patches in patches/.
      - dependency-name: "@blocknote/*"
      - dependency-name: "@quickdrawjs/core"
      # Plugin compatibility target.
      - dependency-name: openclaw
      # Start 1.169 needs Vite 8, and Router has to match the version Start
      # pins. Both move by hand with the Vite 8 major.
      - dependency-name: "@tanstack/react-start"
      - dependency-name: "@tanstack/react-router"
      # React 19.3 adds about 16 KB gzip to every page's entry bundle, so a
      # React minor moves by hand, measured against the bundle budgets.
      - dependency-name: react
        update-types: [version-update:semver-minor]
      - dependency-name: react-dom
        update-types: [version-update:semver-minor]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-minor]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-minor]
      # Change the tool schemas tools/list serves, which stay frozen while
      # directory reviews are pending.
      - dependency-name: zod
      - dependency-name: "@modelcontextprotocol/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: monthly
      time: "05:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 1
    groups:
      desktop:
        applies-to: version-updates
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
