name: Hermes plugin

on:
  # Keep the check present on every pull request so branch protection never
  # waits forever when a change falls outside the plugin path.
  pull_request:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hermes-plugin.yml"
      - "packages/hermes-plugin/**"
      - "plugins/worktable/**"
      - "scripts/skill-inventory.ts"
      - "scripts/generate-hermes-skills.ts"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hermes-plugin-${{ github.ref }}
  cancel-in-progress: true

env:
  # The oldest Hermes release the plugin supports (plugin.yaml requires_hermes).
  HERMES_TAG: v2026.9.24

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out the public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Select plugin inputs
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bun scripts/testing/public-selection.ts

      - name: Check the plugin's skills match their sources
        if: steps.scope.outputs.hermes == 'true'
        run: bun run check:hermes-skills

      - name: Set up Python
        if: steps.scope.outputs.hermes == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Hermes
        if: steps.scope.outputs.hermes == 'true'
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$HERMES_TAG" \
            https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          python -m venv "$RUNNER_TEMP/hermes-venv"
          "$RUNNER_TEMP/hermes-venv/bin/pip" install --quiet -e "$RUNNER_TEMP/hermes-agent[mcp,dev]"
          echo "$RUNNER_TEMP/hermes-venv/bin" >> "$GITHUB_PATH"

      - name: Validate with Hermes
        if: steps.scope.outputs.hermes == 'true'
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          hermes plugins validate packages/hermes-plugin
          hermes plugins doctor packages/hermes-plugin --ci

      - name: Test
        if: steps.scope.outputs.hermes == 'true'
        working-directory: packages/hermes-plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: python -m pytest -q
