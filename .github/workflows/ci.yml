name: Verify
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.15.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Bind source identity after the AGPL cutover
        run: |
          if [ "$(bun -p "require('./package.json').license")" = "AGPL-3.0-only" ]; then
            printf '%s\n' \
              "WORKTABLE_PUBLIC_SOURCE_REPOSITORY=https://github.com/$GITHUB_REPOSITORY" \
              "WORKTABLE_PUBLIC_SOURCE_COMMIT=$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
      - name: Set up Rust
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.97.0
      - name: Verify public installer entry points
        run: |
          cmp scripts/install.sh install.sh
          cmp scripts/install-skills.sh install-skills.sh
      - run: bun install --frozen-lockfile
      - name: Install browser and Desktop dependencies
        run: |
          bunx playwright@1.61.1 install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev libxdo-dev
      - run: bun run check:tools && bun run check:theme && bun run check:brand
      - run: bun run build
      - run: bun run verify:full
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-evidence
          path: test-results/
          if-no-files-found: ignore
